<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obesity Risk Predictor — FitPlan AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="/static/css/obesity.css" rel="stylesheet">
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-brand" href="/">
    <div class="nav-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>
    <span class="nav-wordmark">Fit<em>Plan</em> AI</span>
  </a>
  <a class="nav-back" href="/">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Home
  </a>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
      </svg>
      01 / 03 · Obesity Risk Predictor
    </div>
    <h1>Know your <em>BMI risk</em><br>in seconds</h1>
    <p class="hero-sub">Enter your biometrics and our Random Forest model will classify your obesity level with confidence scores.</p>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="section-label">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
    </svg>
    Your details
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
        </svg>
      </div>
      <div class="card-header-text">
        <h3>Personal Information</h3>
        <p>Used by the Random Forest classifier</p>
      </div>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>Age</label>
          <input type="number" id="age" placeholder="e.g. 28" min="10" max="100"/>
        </div>
        <div class="field">
          <label>Gender</label>
          <select id="gender">
            <option value="1">Male</option>
            <option value="0">Female</option>
          </select>
        </div>
        <div class="field">
          <label>Weight (kg)</label>
          <input type="number" id="weight" placeholder="e.g. 75" min="20" max="200" step="0.1"/>
        </div>
        <div class="field">
          <label>Height (cm)</label>
          <input type="number" id="height" placeholder="e.g. 175" min="100" max="250"/>
        </div>
      </div>

      <!-- BMI -->
      <div class="bmi-box">
        <span class="bmi-box-label">BMI (auto-calculated)</span>
        <div class="bmi-right">
          <span class="bmi-value" id="bmi-display">—</span>
          <span class="bmi-badge" id="bmi-badge"></span>
        </div>
      </div>

      <!-- Button -->
      <button class="btn" id="predict-btn" onclick="predict()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Predict Risk Level
      </button>

      <div id="error-area"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result-area"></div>

</div>

<script src="/static/js/obesity.js" ></script>
</body>
</html>
