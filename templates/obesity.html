<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obesity Risk Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="/static/css/obesity.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
 
  <div class="header">
    <h1>Obesity Risk<br>Predictor</h1>
    <p>Enter your details to assess your BMI risk level.</p>
  </div>
 
  <div class="card">
    <div class="field-grid">
      <div class="field">
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 28" min="10" max="100"/>
      </div>
      <div class="field">
        <label>Gender</label>
        <select id="gender">
          <option value="1">Male</option>
          <option value="0">Female</option>
        </select>
      </div>
      <div class="field">
        <label>Weight (kg)</label>
        <input type="number" id="weight" placeholder="e.g. 75" min="20" max="200" step="0.1"/>
      </div>
      <div class="field">
        <label>Height (cm)</label>
        <input type="number" id="height" placeholder="e.g. 175" min="100" max="250"/>
      </div>
    </div>
 
    <div class="bmi-row">
      <span>BMI (auto-calculated)</span>
      <span id="bmi-display">—</span>
    </div>
 
    <button class="btn" id="predict-btn" onclick="predict()">Predict risk level</button>
 
    <div id="error-area"></div>
  </div>
 
  <div id="result-area"></div>
 
</div>
 
<script src="/static/js/obesity.js">
  
</script>
</body>
</html>
