<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obesity Risk Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg:        #F4F1EC;
      --surface:   #FFFFFF;
      --border:    #E0DAD0;
      --text:      #1A1714;
      --muted:     #7A746B;
      --accent:    #2D5016;
      --accent-lt: #EBF2E2;
      --blue:      #1A3A6B;
      --blue-lt:   #E3EBF8;
      --amber:     #7A4A08;
      --amber-lt:  #FDF3E0;
      --red:       #8B1F1F;
      --red-lt:    #FDEAEA;
      --radius:    12px;
      --shadow:    0 2px 16px rgba(0,0,0,0.07);
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
 
    .wrapper {
      width: 100%;
      max-width: 480px;
    }
 
    .header {
      margin-bottom: 2rem;
    }
 
    .header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
 
    .header p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }
 
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
 
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
 
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
 
    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
 
    .field input,
    .field select {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
 
    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }
 
    .bmi-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
 
    .bmi-row span:first-child {
      font-size: 13px;
      color: var(--muted);
    }
 
    .bmi-row span:last-child {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 500;
    }
 
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
 
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
 
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
 
    /* Result */
    .result {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp 0.3s ease;
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    .result-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
 
    .result-header .label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }
 
    .badge {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }
 
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
    }
 
    .stat {
      padding: 12px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
 
    .stat:last-child { border-right: none; }
 
    .stat .s-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
 
    .stat .s-val {
      font-family: 'DM Mono', monospace;
      font-size: 17px;
      font-weight: 500;
    }
 
    .probs {
      padding: 14px 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
 
    .prob-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
 
    .prob-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
 
    .prob-meta .cls { color: var(--muted); }
    .prob-meta .pct { font-weight: 500; font-family: 'DM Mono', monospace; }
 
    .bar-bg {
      height: 5px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }
 
    .bar-fill {
      height: 5px;
      border-radius: 3px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }
 
    .error-msg {
      margin-top: 10px;
      font-size: 13px;
      color: var(--red);
      padding: 10px 12px;
      background: var(--red-lt);
      border-radius: 8px;
    }
 
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
 
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrapper">
 
  <div class="header">
    <h1>Obesity Risk<br>Predictor</h1>
    <p>Enter your details to assess your BMI risk level.</p>
  </div>
 
  <div class="card">
    <div class="field-grid">
      <div class="field">
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 28" min="10" max="100"/>
      </div>
      <div class="field">
        <label>Gender</label>
        <select id="gender">
          <option value="1">Male</option>
          <option value="0">Female</option>
        </select>
      </div>
      <div class="field">
        <label>Weight (kg)</label>
        <input type="number" id="weight" placeholder="e.g. 75" min="20" max="200" step="0.1"/>
      </div>
      <div class="field">
        <label>Height (cm)</label>
        <input type="number" id="height" placeholder="e.g. 175" min="100" max="250"/>
      </div>
    </div>
 
    <div class="bmi-row">
      <span>BMI (auto-calculated)</span>
      <span id="bmi-display">—</span>
    </div>
 
    <button class="btn" id="predict-btn" onclick="predict()">Predict risk level</button>
 
    <div id="error-area"></div>
  </div>
 
  <div id="result-area"></div>
 
</div>
 
<script>
  const riskConfig = {
    Underweight: { color: '#1A3A6B', bg: '#E3EBF8', barColor: '#378ADD' },
    Normal:      { color: '#2D5016', bg: '#EBF2E2', barColor: '#5DCAA5' },
    Overweight:  { color: '#7A4A08', bg: '#FDF3E0', barColor: '#EF9F27' },
    Obese:       { color: '#8B1F1F', bg: '#FDEAEA', barColor: '#E24B4A' },
  };
 
  document.getElementById('weight').addEventListener('input', updateBMI);
  document.getElementById('height').addEventListener('input', updateBMI);
 
  function updateBMI() {
    const w = parseFloat(document.getElementById('weight').value);
    const h = parseFloat(document.getElementById('height').value);
    if (w && h) {
      document.getElementById('bmi-display').textContent = (w / ((h / 100) ** 2)).toFixed(1);
    } else {
      document.getElementById('bmi-display').textContent = '—';
    }
  }
 
  async function predict() {
    const age    = document.getElementById('age').value.trim();
    const weight = document.getElementById('weight').value.trim();
    const height = document.getElementById('height').value.trim();
    const gender = document.getElementById('gender').value;
 
    document.getElementById('error-area').innerHTML = '';
    document.getElementById('result-area').innerHTML = '';
 
    if (!age || !weight || !height) {
      document.getElementById('error-area').innerHTML =
        '<div class="error-msg">Please fill in all fields before predicting.</div>';
      return;
    }
 
    const btn = document.getElementById('predict-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Predicting...';
 
    try {
      const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ age, weight, height, gender })
      });
 
      if (!response.ok) throw new Error('Server error');
 
      const data = await response.json();
      renderResult(data, age, weight, height);
 
    } catch (err) {
      document.getElementById('error-area').innerHTML =
        '<div class="error-msg">Could not connect to the server. Make sure app.py is running.</div>';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Predict risk level';
    }
  }
 
  function renderResult(data, age, weight, height) {
    const cfg   = riskConfig[data.prediction] || riskConfig['Normal'];
    const probs = data.probabilities;
 
    const barsHTML = Object.entries(probs).map(([cls, pct]) => {
      const c = (riskConfig[cls] || {}).barColor || '#888';
      return `
        <div class="prob-row">
          <div class="prob-meta">
            <span class="cls">${cls}</span>
            <span class="pct">${pct}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width:${pct}%; background:${c};"></div>
          </div>
        </div>`;
    }).join('');
 
    document.getElementById('result-area').innerHTML = `
      <div class="result">
        <div class="result-header" style="background:${cfg.bg};">
          <span class="label">Result</span>
          <span class="badge" style="background:${cfg.bg}; color:${cfg.color}; border:1px solid ${cfg.color}33;">
            ${data.prediction}
          </span>
        </div>
        <div class="stats-row">
          <div class="stat">
            <div class="s-label">BMI</div>
            <div class="s-val">${data.bmi}</div>
          </div>
          <div class="stat">
            <div class="s-label">Age</div>
            <div class="s-val">${age}</div>
          </div>
          <div class="stat">
            <div class="s-label">Weight</div>
            <div class="s-val">${weight} kg</div>
          </div>
        </div>
        <div class="probs">
          ${barsHTML}
        </div>
      </div>`;
  }
</script>
</body>
</html>
